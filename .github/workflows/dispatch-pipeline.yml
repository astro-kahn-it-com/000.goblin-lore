# ─────────────────────────────────────────────────────────────
# WORKFLOW: Dispatch Pipeline (basic, standalone)
#
# Manual entry point for the reusable call-pipeline.yml. Mirrors the upstream
# dispatch-pipeline convention: every call-pipeline input has a matching
# workflow_dispatch input here, so the pipeline can be run by hand with any
# combination of routines.
# ─────────────────────────────────────────────────────────────
name: Dispatch Pipeline

on:
    workflow_dispatch:
        inputs:
            mode:
                description: Failure mode
                required: true
                default: abort_on_error
                type: choice
                options:
                    - report
                    - abort_on_error

            check_mode:
                description: Check routine mode
                required: true
                default: check
                type: choice
                options:
                    - fix
                    - check
                    - skip

            api_report_mode:
                description: API report mode
                required: true
                default: skip
                type: choice
                options:
                    - update
                    - check
                    - skip

            require_lockfile:
                description: Treat npm ci as required (no relaxed fallback)
                required: true
                default: false
                type: boolean

            require_clean_repo:
                description: Fail if the repository becomes dirty
                required: true
                default: false
                type: boolean

            run_build:
                description: Run npm run build
                required: true
                default: true
                type: boolean

            run_test:
                description: Run npm run test
                required: true
                default: false
                type: boolean

            run_docs_build:
                description: Run docs build routine (npm run docs:build --if-present)
                required: true
                default: false
                type: boolean

            node_version:
                description: Node version to run
                required: true
                default: '20'
                type: choice
                options:
                    - '20'
                    - '22'
                    - 'lts/*'

            npm_cache:
                description: Enable setup-node npm cache
                required: true
                default: true
                type: boolean

permissions:
    contents: read

jobs:
    pipeline:
        uses: ./.github/workflows/call-pipeline.yml
        secrets: inherit
        with:
            mode: ${{ inputs.mode }}
            check_mode: ${{ inputs.check_mode }}
            api_report_mode: ${{ inputs.api_report_mode }}
            require_lockfile: ${{ inputs.require_lockfile }}
            require_clean_repo: ${{ inputs.require_clean_repo }}
            run_build: ${{ inputs.run_build }}
            run_test: ${{ inputs.run_test }}
            run_docs_build: ${{ inputs.run_docs_build }}
            node_version: ${{ inputs.node_version }}
            npm_cache: ${{ inputs.npm_cache }}

    summary:
        name: Summarize pipeline outputs
        runs-on: ubuntu-latest
        needs: pipeline
        if: ${{ always() }}
        steps:
            - name: Output summary
              shell: bash
              run: |
                  {
                    echo "## Pipeline dispatch result"
                    echo ""
                    echo "- pipeline result: \`${{ needs.pipeline.result }}\`"
                    echo "- is_repo_dirty: \`${{ needs.pipeline.outputs.is_repo_dirty }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
