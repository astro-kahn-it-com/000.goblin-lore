# ─────────────────────────────────────────────────────────────
# WORKFLOW: Dispatch Workspace Update & Commit (basic, standalone)
#
# Manual entry point that runs the selected write routines (fix, docs build, API
# report) and commits + pushes whatever they change back to the current branch.
# Mirrors the input surface of the upstream dispatch-workspace-update.yml, but
# calls this repo's self-contained call-pipeline.yml (which does the routines and
# the commit in one job — no workspace-artifact hop).
#
# Refuses to run on main and refuses an empty selection.
# ─────────────────────────────────────────────────────────────
name: Dispatch Workspace Update & Commit

on:
    workflow_dispatch:
        inputs:
            run_fix:
                description: Run fix routine
                required: true
                default: false
                type: boolean

            run_docs:
                description: Run docs build routine
                required: true
                default: false
                type: boolean

            run_api_report:
                description: Run API report update routine
                required: true
                default: false
                type: boolean

            commit_message_type:
                description: Conventional commit type prefix
                required: false
                default: chore
                type: choice
                options: [chore, style, docs, build, fix]

            commit_message_subject:
                description: Commit subject without type/scope.
                required: false
                default: workspace update
                type: string

permissions:
    contents: write
    actions: read
    id-token: write

env:
    HUSKY: 0

jobs:
    guard:
        name: Guard
        runs-on: ubuntu-latest
        steps:
            - name: Refuse main and empty selection
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "${{ github.ref_name }}" == "main" ]]; then
                    echo "::error::Workspace update cannot run on main. Check out a feature or fix branch first."
                    exit 1
                  fi

                  if [[ "${{ inputs.run_fix }}" != "true" &&
                        "${{ inputs.run_docs }}" != "true" &&
                        "${{ inputs.run_api_report }}" != "true" ]]; then
                    echo "::error::Select at least one routine: fix, docs, or API report."
                    exit 1
                  fi

                  echo "Branch: ${{ github.ref_name }}"

    workspace_update:
        name: Run routines and commit
        needs: guard
        uses: ./.github/workflows/call-pipeline.yml
        secrets: inherit
        with:
            checkout_ref: ${{ github.ref_name }}
            mode: report
            check_mode: ${{ inputs.run_fix && 'fix' || 'skip' }}
            api_report_mode: ${{ inputs.run_api_report && 'update' || 'skip' }}
            require_lockfile: false
            run_build: false
            run_test: false
            run_docs_build: ${{ inputs.run_docs }}
            require_clean_repo: false
            commit_mode: commit_if_dirty
            commit_message: "${{ format('{0}(root): {1}', inputs.commit_message_type, inputs.commit_message_subject) }}"
            scoped_commit_message: true
            push_branch: ${{ github.ref_name }}
