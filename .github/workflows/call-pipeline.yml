# ─────────────────────────────────────────────────────────────
# WORKFLOW: Pipeline (basic, standalone)
# TYPE: reusable (workflow_call)
#
# A self-contained npm pipeline for this repo. It mirrors the input surface of
# gbtunney/snailicid3-actions/.github/workflows/call-pipeline.yml but runs npm
# scripts directly (no pnpm / nx / chromatic) and folds in the commit + push
# behaviour of call-apply-workspace-artifact.yml.
#
# The upstream pair uploads a workspace tarball from call-pipeline and re-applies
# it in call-apply-workspace-artifact because those are two reusable workflows on
# two runners. Here everything runs in one job on one runner, so the routines and
# the commit happen in place — no artifact hop needed.
#
# Routines (each gated by an input):
#   run_build            → npm run build
#   run_test             → npm run test
#   run_docs_build       → npm run docs:build   (--if-present)
#   check_mode=fix|check → npm run fix | npm run check
#   api_report_mode      → npm run api:report | npm run api:check   (--if-present)
#
# Commit handling (commit_mode):
#   skip                      → never commit
#   commit_if_dirty           → commit + push when the tree is dirty
#   require_dirty_then_commit → fail if clean, else commit + push
#   require_clean             → fail if the routines left the tree dirty
#
# mode=report makes routine failures non-fatal (continue-on-error) so a fix/report
# routine still commits its output; mode=abort_on_error fails the job on the first
# routine error.
# ─────────────────────────────────────────────────────────────
name: z Call Pipeline

on:
    workflow_call:
        secrets:
            GH_PAT:
                description: Optional token used for checkout/push so a pushed commit can trigger follow-up workflows.
                required: false

        inputs:
            checkout_ref:
                description: Optional ref to check out before running the pipeline. Empty uses the triggering ref.
                required: false
                default: ''
                type: string

            mode:
                description: report (routine failures are non-fatal) or abort_on_error.
                required: false
                default: report
                type: string

            check_mode:
                description: fix | check | skip.
                required: false
                default: check
                type: string

            api_report_mode:
                description: update | check | skip.
                required: false
                default: skip
                type: string

            require_lockfile:
                description: Treat `npm ci` as required (no relaxed `npm install` fallback).
                required: false
                default: false
                type: boolean

            run_build:
                required: false
                default: true
                type: boolean

            run_test:
                required: false
                default: false
                type: boolean

            run_docs_build:
                required: false
                default: false
                type: boolean

            require_clean_repo:
                description: Fail if the repository is dirty after the routines run.
                required: false
                default: false
                type: boolean

            commit_mode:
                description: skip | commit_if_dirty | require_dirty_then_commit | require_clean.
                required: false
                default: skip
                type: string

            commit_message:
                description: 'Commit message when committing. Format `type(scope): subject`.'
                required: false
                default: 'chore(root): workspace update'
                type: string

            scoped_commit_message:
                description: Recompute the scope from staged changes via scope-commit before committing.
                required: false
                default: false
                type: boolean

            push_branch:
                description: Branch to push committed changes to. Empty skips the push.
                required: false
                default: ''
                type: string

            node_version:
                description: Node version to run the pipeline with.
                required: false
                default: '20'
                type: string

            npm_cache:
                description: Enable setup-node's npm cache.
                required: false
                default: true
                type: boolean

        outputs:
            is_repo_dirty:
                description: Whether the repository is dirty after the routines ('true' | 'false').
                value: ${{ jobs.pipeline.outputs.is_repo_dirty }}

# contents: write so the commit/push path works when a caller grants it. A
# read-only caller (e.g. dispatch-pipeline) caps this back down to read, and its
# commit_mode=skip means nothing is pushed anyway.
permissions:
    contents: write

env:
    HUSKY: 0

jobs:
    pipeline:
        name: pipeline
        runs-on: ubuntu-latest
        outputs:
            is_repo_dirty: ${{ steps.repo_dirty.outputs.is_repo_dirty }}
        steps:
            - name: Validate commit mode
              shell: bash
              run: |
                  set -euo pipefail
                  case "${{ inputs.commit_mode }}" in
                    skip|commit_if_dirty|require_dirty_then_commit|require_clean) ;;
                    *) echo "::error::Invalid commit_mode: ${{ inputs.commit_mode }}"; exit 1 ;;
                  esac

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.checkout_ref || github.ref }}
                  token: ${{ secrets.GH_PAT || github.token }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ inputs.node_version }}
                  cache: ${{ inputs.npm_cache && 'npm' || '' }}

            - name: Install (frozen lockfile)
              id: install_frozen
              continue-on-error: true
              run: npm ci

            - name: Install (relaxed, fallback)
              id: install_relaxed
              if: ${{ steps.install_frozen.outcome == 'failure' && !inputs.require_lockfile }}
              run: npm install --no-audit --no-fund

            - name: Validate install
              if: ${{ steps.install_frozen.outcome == 'failure' && (inputs.require_lockfile || steps.install_relaxed.outcome == 'failure') }}
              run: |
                  echo "::error::Dependency install failed."
                  exit 1

            - name: Input summary
              shell: bash
              run: |
                  {
                    echo "## Pipeline inputs"
                    echo ""
                    echo "- checkout_ref: \`${{ inputs.checkout_ref || github.ref }}\`"
                    echo "- mode: \`${{ inputs.mode }}\`"
                    echo "- check_mode: \`${{ inputs.check_mode }}\`"
                    echo "- api_report_mode: \`${{ inputs.api_report_mode }}\`"
                    echo "- run_build: \`${{ inputs.run_build }}\`"
                    echo "- run_test: \`${{ inputs.run_test }}\`"
                    echo "- run_docs_build: \`${{ inputs.run_docs_build }}\`"
                    echo "- require_clean_repo: \`${{ inputs.require_clean_repo }}\`"
                    echo "- commit_mode: \`${{ inputs.commit_mode }}\`"
                    echo "- push_branch: \`${{ inputs.push_branch }}\`"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            # ── Routines ───────────────────────────────────────────────────────
            - name: Build
              if: ${{ inputs.run_build }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: npm run build

            - name: Test
              if: ${{ inputs.run_test }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: npm run test --if-present

            - name: Docs build
              if: ${{ inputs.run_docs_build }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: npm run docs:build --if-present

            - name: Fix routine
              if: ${{ inputs.check_mode == 'fix' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: npm run fix

            - name: Check routine
              if: ${{ inputs.check_mode == 'check' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: npm run check

            - name: Skip check routine
              if: ${{ inputs.check_mode == 'skip' }}
              run: echo "check_mode=skip"

            - name: Update API report
              if: ${{ inputs.api_report_mode == 'update' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: npm run api:report --if-present

            - name: Check API report
              if: ${{ inputs.api_report_mode == 'check' }}
              continue-on-error: ${{ inputs.mode == 'report' }}
              run: npm run api:check --if-present

            - name: Skip API report
              if: ${{ inputs.api_report_mode == 'skip' }}
              run: echo "api_report_mode=skip"

            # ── Dirty state + commit ───────────────────────────────────────────
            - name: Report dirty state
              id: repo_dirty
              if: ${{ always() }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "is_repo_dirty=true" >> "$GITHUB_OUTPUT"
                    echo "Repository is dirty:"
                    git status --short
                  else
                    echo "is_repo_dirty=false" >> "$GITHUB_OUTPUT"
                    echo "Repository is clean."
                  fi

            - name: Validate dirty state
              shell: bash
              run: |
                  set -euo pipefail
                  mode="${{ inputs.commit_mode }}"
                  dirty="${{ steps.repo_dirty.outputs.is_repo_dirty }}"
                  case "$mode" in
                    skip|commit_if_dirty) ;;
                    require_dirty_then_commit)
                      if [ "$dirty" != "true" ]; then echo "::error::Expected a dirty tree, but it is clean."; exit 1; fi ;;
                    require_clean)
                      if [ "$dirty" = "true" ]; then echo "::error::Expected a clean tree, but the routines produced changes."; git status --short; exit 1; fi ;;
                  esac

            - name: Require clean repository
              if: ${{ inputs.require_clean_repo && steps.repo_dirty.outputs.is_repo_dirty == 'true' }}
              run: |
                  echo "::error::Repository is dirty after the pipeline."
                  exit 1

            - name: Commit changes
              if: ${{ steps.repo_dirty.outputs.is_repo_dirty == 'true' && contains(fromJSON('["commit_if_dirty","require_dirty_then_commit"]'), inputs.commit_mode) }}
              shell: bash
              run: |
                  set -euo pipefail

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config commit.gpgsign false

                  git add -A
                  if git diff --cached --quiet; then
                    echo "No staged changes; skipping commit."
                    exit 0
                  fi

                  commit_message="${{ inputs.commit_message }}"

                  # Recompute the scope from the staged files, the same way the
                  # local commit scripts do. scope-commit resolves via npm exec
                  # (workspace bin or the published @snailicid3/config), so
                  # node_modules must already exist — it does, install ran above.
                  if [ "${{ inputs.scoped_commit_message }}" = "true" ]; then
                    if [[ "$commit_message" == *": "* ]]; then
                      header="${commit_message%%: *}"
                      subject="${commit_message#*: }"
                      type="${header%%(*}"
                      if scoped="$(SCOPE_COMMIT_SKIP_COMMITLINT=1 npm exec -- scope-commit --staged --message "$type" "$subject")" \
                        && [ -n "$scoped" ]; then
                        commit_message="$scoped"
                      else
                        echo "::warning::scope-commit failed; falling back to: $commit_message"
                      fi
                    else
                      echo "::warning::Could not parse commit_message for scope recomputation: $commit_message"
                    fi
                  fi

                  echo "Commit message: $commit_message"
                  git commit -m "$commit_message" \
                    -m "Triggered by: @${{ github.actor }}" \
                    -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Push changes
              if: ${{ steps.repo_dirty.outputs.is_repo_dirty == 'true' && inputs.push_branch != '' && contains(fromJSON('["commit_if_dirty","require_dirty_then_commit"]'), inputs.commit_mode) }}
              run: git push origin HEAD:${{ inputs.push_branch }}

            - name: Summary
              if: ${{ always() }}
              shell: bash
              run: |
                  {
                    echo "## Pipeline outputs"
                    echo ""
                    echo "- is_repo_dirty: \`${{ steps.repo_dirty.outputs.is_repo_dirty }}\`"
                    echo "- commit_mode: \`${{ inputs.commit_mode }}\`"
                    echo "- push_branch: \`${{ inputs.push_branch }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
